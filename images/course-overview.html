<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf8f1;
      --color-ink:     #1c1c1c;
      --color-muted:   #555555;
      --font-sans:     'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }
    .frame { max-width: 960px; width: 100%; }
    h1 {
      font-size: clamp(1.75rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .subtitle { font-size: 1rem; color: var(--color-muted); margin-bottom: 2rem; }
    .figure { overflow-x: auto; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Introduction to Data Structures</h1>
    <p class="subtitle">Big-O primer · 5 lessons · final quiz · certificate</p>

    <div class="figure">
    <svg viewBox="0 0 960 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-overview-title course-overview-desc"
         font-family="Inter, system-ui, sans-serif">
      <title id="course-overview-title">Introduction to Data Structures: course path</title>
      <desc id="course-overview-desc">The course starts with a Big-O primer, then five lessons on the stack, queue, linked list, binary search tree and hash table, then a final quiz; scoring 8 of 10 earns a certificate you can download and share.</desc>
      <defs>
        <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#444444"/></marker>
        <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#2e7d32"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf8f1"/>

      <!-- Zone: the five lessons -->
      <rect x="40" y="136" width="880" height="144" rx="16" fill="#ebf0f4" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="56" y="164" font-size="16" font-weight="700" fill="#245c99">5 lessons</text>

      <!-- Connectors -->
      <line x1="480" y1="96" x2="480" y2="136" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="256" y1="280" x2="256" y2="344" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="376" y1="384" x2="520" y2="384" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Connector label -->
      <rect x="390" y="356" width="116" height="20" fill="#faf8f1"/>
      <text x="448" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#276b2b">8 of 10 to pass</text>

      <!-- Start -->
      <rect x="360" y="32" width="240" height="64" rx="12" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
      <text x="480" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Big-O primer</text>

      <!-- Lessons -->
      <rect x="60" y="180" width="152" height="80" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="136" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Stack</text>

      <rect x="232" y="180" width="152" height="80" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="308" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Queue</text>

      <rect x="404" y="180" width="152" height="80" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="480" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Linked list</text>

      <rect x="576" y="180" width="152" height="80" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="652" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Binary</text>
      <text x="652" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">search tree</text>

      <rect x="748" y="180" width="152" height="80" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="824" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Hash table</text>

      <!-- Final quiz -->
      <rect x="136" y="344" width="240" height="80" rx="12" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
      <text x="256" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Final quiz</text>

      <!-- Focal: the certificate (larger, double frame like the real one) -->
      <rect x="520" y="320" width="320" height="128" rx="12" fill="#dff0e0" stroke="#2e7d32" stroke-width="3"/>
      <rect x="528" y="328" width="304" height="112" rx="8" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
      <text x="680" y="376" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1c">Your certificate</text>
      <text x="680" y="408" text-anchor="middle" font-size="16" fill="#555555">Download and share</text>
    </svg>
    </div>
  </div>
</body>
</html>
