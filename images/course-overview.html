<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf8f1;
      --color-ink:     #1c1c1c;
      --color-muted:   #555555;
      --font-sans:     'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }
    .frame { max-width: 960px; width: 100%; }
    h1 {
      font-size: clamp(1.75rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .subtitle { font-size: 1rem; color: var(--color-muted); margin-bottom: 2rem; }
    .figure { overflow-x: auto; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Introduction to Data Structures</h1>
    <p class="subtitle">Big-O primer · 5 lessons with theory, animations and practice · final quiz · certificate</p>

    <div class="figure">
    <svg viewBox="0 0 960 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-overview-title course-overview-desc"
         font-family="Inter, system-ui, sans-serif">
      <title id="course-overview-title">Introduction to Data Structures: course path</title>
      <desc id="course-overview-desc">The course starts with a Big-O primer, covers five data structures in two groups (stack, queue and linked list; binary search tree and hash table), then a final quiz where 8 of 10 correct earns a signed certificate you can download.</desc>
      <defs>
        <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#444444"/></marker>
        <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#2e7d32"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf8f1"/>

      <!-- Zones -->
      <rect x="40" y="160" width="520" height="176" rx="16" fill="#ebf0f4" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="56" y="188" font-size="16" font-weight="700" fill="#245c99">Linear structures</text>
      <rect x="592" y="160" width="328" height="176" rx="16" fill="#f3edf2" stroke="#7b4a8f" stroke-width="1.5"/>
      <text x="608" y="188" font-size="16" font-weight="700" fill="#7b4a8f">Key-based structures</text>

      <!-- Connectors -->
      <path d="M 464 112 V 124 Q 464 136 452 136 H 312 Q 300 136 300 148 V 160" fill="none" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M 496 112 V 124 Q 496 136 508 136 H 744 Q 756 136 756 148 V 160" fill="none" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="240" y1="336" x2="240" y2="432" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M 756 336 V 372 Q 756 384 744 384 H 308 Q 296 384 296 396 V 432" fill="none" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="376" y1="480" x2="520" y2="480" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Connector label -->
      <rect x="390" y="452" width="116" height="20" fill="#faf8f1"/>
      <text x="448" y="467" text-anchor="middle" font-size="12" font-weight="700" fill="#276b2b">8 of 10 to pass</text>

      <!-- Start: Big-O primer -->
      <rect x="360" y="32" width="240" height="80" rx="12" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
      <text x="480" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Big-O primer</text>
      <text x="480" y="92" text-anchor="middle" font-size="12" fill="#555555">How cost grows with the data</text>

      <!-- Linear lessons -->
      <rect x="60" y="204" width="144" height="112" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="132" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Stack</text>
      <text x="132" y="272" text-anchor="middle" font-size="12" fill="#1c1c1c">Last in, first out</text>
      <text x="132" y="292" text-anchor="middle" font-size="12" fill="#555555">Undo, call stacks</text>

      <rect x="228" y="204" width="144" height="112" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="300" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Queue</text>
      <text x="300" y="272" text-anchor="middle" font-size="12" fill="#1c1c1c">First in, first out</text>
      <text x="300" y="292" text-anchor="middle" font-size="12" fill="#555555">Built from two stacks</text>

      <rect x="396" y="204" width="144" height="112" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="468" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Linked list</text>
      <text x="468" y="272" text-anchor="middle" font-size="12" fill="#1c1c1c">Singly linked nodes</text>
      <text x="468" y="292" text-anchor="middle" font-size="12" fill="#555555">O(1) insert at head</text>

      <!-- Key-based lessons -->
      <rect x="612" y="204" width="132" height="112" rx="12" fill="#ffffff" stroke="#7b4a8f" stroke-width="1.5"/>
      <text x="678" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">BST</text>
      <text x="678" y="272" text-anchor="middle" font-size="12" fill="#1c1c1c">Binary search tree</text>
      <text x="678" y="292" text-anchor="middle" font-size="12" fill="#555555">O(log n) search</text>

      <rect x="768" y="204" width="132" height="112" rx="12" fill="#ffffff" stroke="#7b4a8f" stroke-width="1.5"/>
      <text x="834" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Hash table</text>
      <text x="834" y="272" text-anchor="middle" font-size="12" fill="#1c1c1c">Key → value pairs</text>
      <text x="834" y="292" text-anchor="middle" font-size="12" fill="#555555">O(1) average lookup</text>

      <!-- Final quiz -->
      <rect x="136" y="432" width="240" height="96" rx="12" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
      <text x="256" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Final quiz</text>
      <text x="256" y="496" text-anchor="middle" font-size="12" fill="#1c1c1c">10 questions, every lesson</text>
      <text x="256" y="516" text-anchor="middle" font-size="12" fill="#555555">Each answer explained</text>

      <!-- Focal: the certificate (larger, double frame like the real one) -->
      <rect x="520" y="408" width="320" height="144" rx="12" fill="#dff0e0" stroke="#2e7d32" stroke-width="3"/>
      <rect x="528" y="416" width="304" height="128" rx="8" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
      <text x="680" y="460" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1c">Your certificate</text>
      <text x="680" y="492" text-anchor="middle" font-size="16" fill="#1c1c1c">With your name, signed</text>
      <text x="680" y="520" text-anchor="middle" font-size="16" fill="#555555">Download as image or PDF</text>
    </svg>
    </div>
  </div>
</body>
</html>
